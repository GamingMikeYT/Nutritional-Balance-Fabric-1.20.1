
#General Settings
[general]

	#Food tags and item IDs used to assign nutrients. Cooked and crafted foods may inherit nutrients from recipe ingredients.
	[general.nutrient_foods]
		#List of carbohydrates.
		carbs_item_list = ["#c:carbs", "#c:grain", "#c:bread/wheat", "#c:foods/breads", "#c:foods/breads/wheat", "#nourish:carbohydrates"]
		#List of proteins.
		protein_item_list = ["#c:protein", "#c:proteins", "#c:milk", "#c:yogurt", "#c:nuts", "#nourish:protein"]
		#List of simple sugars.
		sugars_item_list = ["#nourish:sweets", "#c:sugars", "#c:candies", "#c:foods/candy"]
		#List of fruits.
		fruits_item_list = ["#c:fruits", "#c:fruit", "#c:fruits/berry", "#c:berries", "#nourish:fruit"]
		#List of vegetables.
		vegetables_item_list = ["#minecraft:flowers", "#c:vegetables", "#nourish:vegetables"]

	#Nutrient Levels
	[general.nutrient_levels]
		#Maximum food value a single nutrient can provide. (default:20.0)
		#Range: 1.0 ~ 1.7976931348623157E308
		nutrient_max_food_value = 20.0
		#Engorgement value, above which bad effects can occur. (default:170.0)
		#Range: 0.0 ~ 1.7976931348623157E308
		nutrient_level_engorged = 170.0
		#Nutrient loss on death, bottoming out at the initial value. (default:10.0)
		#Range: 0.0 ~ 1.7976931348623157E308
		nutrient_death_loss = 10.0
		#Malnourishment value, below which bad effects can occur. (default:1.0)
		#Range: 0.0 ~ 1.7976931348623157E308
		nutrient_level_malnourished = 1.0
		#Boundary between target and high, below which good effects can occur. (default:120.0)
		#Range: 0.0 ~ 1.7976931348623157E308
		nutrient_level_target_high = 120.0
		#Boundary between low and target, above which good effects can occur. (default:100.0)
		#Range: 0.0 ~ 1.7976931348623157E308
		nutrient_level_low_target = 100.0
		#Nutrient decay rate relative to player saturation and food level decay. (default:1.0)
		#Range: 0.0 ~ 1.7976931348623157E308
		nutrient_decay_rate = 1.0
		#Initial nutrient level for new player. (default:50.0)
		#Range: 0.0 ~ 1.7976931348623157E308
		nutrient_initial = 50.0
		#Nutrient increment rate relative to food saturation and points. (default:1.0)
		#Range: 0.0 ~ 1.7976931348623157E308
		nutrient_increment_rate = 1.0
		#Number of inventory slots the lunchbox contains. (default:5)
		#Range: 1 ~ 9
		lunchbox_slot_count = 5
		#Maximum nutrient level. Nutrients will cap out at this value. (default:180.0)
		#Range: 0.0 ~ 1.7976931348623157E308
		nutrient_level_max = 180.0

	#Effects
	[general.nutrition_affects]
		#Nutrients which only give good effects. (default:vegetables)
		effect_good_nutrients = ["vegetables"]
		#Nutrients which only give bad effects when engorged. (default:sugars)
		effect_bad_nutrients = ["sugars"]

		#Nourished Effects
		[general.nutrition_affects.nourished_affects]
			#Health points to add or subtract. (default:10.0)
			#Range: -40.0 ~ 40.0
			nourished_max_health = 10.0
			#Knockback resistance to add. (default:0.0)
			#Range: 0.0 ~ 1.0
			nourished_knockback_resistance = 0.0
			#Attack damage modifier. (default:0.2)
			#Range: -2.0 ~ 4.0
			nourished_attack_damage = 0.2
			#Mining speed modifier. (default:0.1)
			#Range: -4.0 ~ 4.0
			nourished_mining_speed = 0.1
			#Movement speed modifier. (default:0.2)
			#Range: -0.7 ~ 2.0
			nourished_movement_speed = 0.2
			#Attack knockback modifier. (default:0.0)
			#Range: 0.0 ~ 4.0
			nourished_knockback = 0.0

		#Malnourished Effects
		[general.nutrition_affects.malnourished_affects]
			#Knockback resistance modifier. (default:0.0)
			#Range: 0.0 ~ 4.0
			malnourished_knockback = 0.0
			#Attack damage modifier. (default:-0.15)
			#Range: -2.0 ~ 4.0
			malnourished_attack_damage = -0.15
			#Knockback resistance modifier. (default:0.0)
			#Range: 0.0 ~ 1.0
			malnourished_knockback_resistance = 0.0
			#Movement speed modifier. (default:-0.15)
			#Range: -0.7 ~ 2.0
			malnourished_movement_speed = -0.15
			#Mining speed modifier. (default:0.0)
			#Range: -4.0 ~ 4.0
			malnourished_mining_speed = 0.0
			#Health points to add or subtract. (default:-4.0)
			#Range: -40.0 ~ 40.0
			malnourished_max_health = -4.0

		#Engorged Effects
		[general.nutrition_affects.engorged_affects]
			#Mining speed modifier. (default:-0.1)
			#Range: -4.0 ~ 4.0
			engorged_mining_speed = -0.1
			#Movement speed modifier. (default:-0.15)
			#Range: -0.7 ~ 2.0
			engorged_movement_speed = -0.15
			#Knockback resistance modifier. (default:0.0)
			#Range: 0.0 ~ 1.0
			engorged_knockback_resistance = 0.0
			#Attack damage modifier. (default:0.0)
			#Range: -2.0 ~ 4.0
			engorged_attack_damage = 0.0
			#Knockback resistance modifier. (default:0.0)
			#Range: 0.0 ~ 4.0
			engorged_knockback = 0.0
			#Health points to add or subtract. (default:0.0)
			#Range: -40.0 ~ 40.0
			engorged_max_health = 0.0

